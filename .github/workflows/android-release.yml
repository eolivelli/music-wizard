# Fires on android-v* tags: builds the debug APK and attaches it to the
# GitHub release for that tag, which is how a testable build reaches a
# real phone. Debug-signed on purpose — installable everywhere, no signing
# secrets in CI; see android.yml for the reasoning.
name: android-release

on:
  push:
    tags: ['android-v*']

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Install shared MW modules
        run: mvn -B --no-transfer-progress -DskipTests install
      - name: Build and test the app
        working-directory: android
        run: ./gradlew --no-daemon test assembleDebug
      - name: Attach the APK to the release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          gh release create "$GITHUB_REF_NAME" --prerelease --generate-notes \
            --title "MW Android $GITHUB_REF_NAME (debug build for field testing)" \
            "$apk" 2>/dev/null || gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
