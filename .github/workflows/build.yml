name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The default build must stay fast, offline and dependency-free: no models
  # downloaded, no LilyPond required. If this job ever needs the network for
  # anything but Maven Central, something has leaked out of the integration tier.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Build and run unit tests
        run: mvn -B --no-transfer-progress verify
      # The sample harnesses cannot run here -- the benchmarks they need are
      # local-only for licensing -- but the arithmetic they score a bar and a
      # word by can, on fixtures. Seconds, and no jar needed.
      #
      # ffmpeg IS needed, by the two tests that mix a bed against a voice and
      # assert where it lands. They skip without it, and a skipped test is the
      # shape of defect they exist to catch: they were written because nothing
      # reached the mixing layer, and on a runner with no ffmpeg nothing would
      # reach it here either, greenly. The runner image does not carry one.
      - name: Install ffmpeg for the mixing tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test the sample-harness scoring rules
        run: python3 tools/test-harness-rules.py

  # Slow tier: exercises the real engraver and the ground-truth loop.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Install LilyPond
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lilypond
          lilypond --version
      - name: Run integration tests
        run: mvn -B --no-transfer-progress verify -Pintegration

  # The sherpa-onnx ASR provider: built from the source submodule, which the
  # other jobs deliberately do not check out -- their builds must stay free of
  # it, which is also what keeps the default build's behaviour identical to a
  # clone without the submodule. The native build is cached on the submodule
  # commit plus the build script (whose flags are the licence position); a
  # cache hit makes this job minutes, a miss ~half an hour of C++.
  sherpa:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Compute the native cache key
        id: nativekey
        run: echo "submodule=$(git rev-parse HEAD:third_party/sherpa-onnx)" >> "$GITHUB_OUTPUT"
      - name: Cache the native build
        uses: actions/cache@v4
        with:
          path: third_party/sherpa-onnx/build
          key: sherpa-native-${{ runner.os }}-${{ steps.nativekey.outputs.submodule }}-${{ hashFiles('tools/build-sherpa-native.sh') }}
      # The script ends by running tools/check-sherpa-native.sh: the espeak
      # symbol scan that asserts the GPL fork stayed out of the link.
      - name: Build the native library
        run: tools/build-sherpa-native.sh
      - name: Build and test the sherpa provider
        run: mvn -B --no-transfer-progress -pl mw-ml -am test

  # Runs the enforcer, which denies the artifacts named in the root pom. It reads
  # no licence metadata, so this catches a coordinate someone has already ruled
  # out and not a GPL artifact nobody has listed; CONTRIBUTING.md says what the
  # policy is and #336 asks whether to make it mechanical.
  licensing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      # The enforcer rules are bound to the build lifecycle, so they must be
      # triggered through a phase; `enforcer:enforce` from the command line sees
      # no rules at all and fails with "No rules are configured".
      - name: Verify dependency licensing rules
        run: mvn -B --no-transfer-progress validate
      - name: Record the resolved dependency tree
        run: mvn -B --no-transfer-progress dependency:tree -Dscope=compile

  # The synthetic corpus gate (#447). Unlike samples/, every synthetic package
  # is committed — spec, MIDI and audio — so this harness runs here end to
  # end, and its output is diffed exactly against the committed baseline. Any
  # movement fails the job, an improvement included: regenerating the baseline
  # in the same PR is what puts the movement in front of a reviewer. This is
  # what lets the music-teacher corpus grow without silently regressing what
  # MW already reads correctly.
  synthetic-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Build the CLI
        run: mvn -B --no-transfer-progress -DskipTests package
      - name: Score the synthetic corpus and diff the baseline
        run: |
          mkdir -p target
          python3 tools/score-synthetic.py | tee target/score-synthetic.txt
          diff -u tools/baselines/score-synthetic.txt target/score-synthetic.txt
      # The melody stage's own gate (#494), on the same corpus and in the same
      # job: it needs the same jar and the same packages, and a second job
      # would build the jar twice to score the same files.
      - name: Score the melody stage and diff the baseline
        run: |
          python3 tools/score-melody.py | tee target/score-melody.txt
          diff -u tools/baselines/score-melody.txt target/score-melody.txt

  # Analyzes every committed sample and publishes the corpus status to the
  # run's summary page: tempo, meter and span count per file, plus the scored
  # harnesses for the files with registered ground truth. Local-only samples
  # (licensing-bound; see samples/list.txt) are absent here by design and the
  # harnesses report them as skipped rather than failing.
  samples-report:
    runs-on: ubuntu-latest
    # Every committed sample is decoded and analyzed once for the table and
    # again by each harness, so this is the long job of the matrix; the bound
    # is there to stop a hung analysis holding a runner for six hours. It grows
    # with the corpus, not with the code: every grid confirmed in
    # samples/list.txt adds a file to each chord harness.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Build the CLI
        run: mvn -B --no-transfer-progress -DskipTests package
      # The script prints the report to the log as well as appending it to
      # $GITHUB_STEP_SUMMARY, so the numbers survive even if the summary page
      # does not render them.
      - name: Analyze the committed corpus and publish the summary
        run: tools/ci-samples-report.sh
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samples-report
          path: target/samples-report.md
          if-no-files-found: warn
