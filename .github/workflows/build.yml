name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The default build must stay fast, offline and dependency-free: no models
  # downloaded, no LilyPond required. If this job ever needs the network for
  # anything but Maven Central, something has leaked out of the integration tier.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Build and run unit tests
        run: mvn -B --no-transfer-progress verify

  # Slow tier: exercises the real engraver and the ground-truth loop.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Install LilyPond
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lilypond
          lilypond --version
      - name: Run integration tests
        run: mvn -B --no-transfer-progress verify -Pintegration

  # Guards the licensing policy: the enforcer bans GPL/AGPL artifacts, and this
  # makes a violation fail the build rather than being noticed at release time.
  licensing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Verify dependency licensing rules
        run: mvn -B --no-transfer-progress enforcer:enforce
