# CI for the Android field-recording app (epic #236).
#
# Dormant until android/ exists: the push/PR triggers are path-filtered, so
# this workflow first runs on the commit that creates the project. The
# release job fires on android-v* tags and attaches the APK to the GitHub
# release, which is how a testable build reaches a phone.
#
# The app is built as a DEBUG APK on purpose: debug builds are signed with
# the auto-generated debug keystore, so they install on a real device with
# no signing secrets in CI. A proper release signature is a later problem;
# a data-collection instrument does not need one.
name: android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    # Skip gracefully on the workflow-only commit that lands before the app.
    steps:
      - uses: actions/checkout@v4
      - name: Check the project exists
        id: exists
        run: test -f android/gradlew && echo "yes=true" >> "$GITHUB_OUTPUT" || echo "yes=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.exists.outputs.yes == 'true'
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      # The shared MW modules are consumed as jars from a local Maven repo the
      # Gradle build reads; install them first. ubuntu-latest runners ship the
      # Android SDK preinstalled.
      - name: Install shared MW modules at release 21
        if: steps.exists.outputs.yes == 'true'
        run: mvn -B --no-transfer-progress -DskipTests install
      - name: Build and test the app
        if: steps.exists.outputs.yes == 'true'
        working-directory: android
        run: ./gradlew --no-daemon test assembleDebug
      - name: Upload the APK as a run artifact
        if: steps.exists.outputs.yes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mw-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
