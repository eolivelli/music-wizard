// Standalone Gradle build for the field-recording app (epic #236). The Maven
// reactor does not build it; it consumes the six MW modules as jars from the
// local Maven repository, which `mvn -DskipTests install` fills.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    repositories {
        // First, so the MW snapshots come from this machine's own install and
        // never from a remote that has no such artifact.
        mavenLocal()
        google()
        mavenCentral()
    }
}

rootProject.name = 'mw-android'
include ':app'
